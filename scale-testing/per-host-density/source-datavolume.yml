apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  labels:
    test-type: per-host-density
  name: {{.name}}
spec:
  source:
{{- if hasPrefix .imageUrl "docker://" }}
    registry:
      url: {{ .imageUrl }}
{{- else }}
    http:
        url: {{.imageUrl}}
{{- end }}
  storage:
    accessModes:
    - ReadWriteMany
    resources:
      requests:
        storage: {{.storage}}
    storageClassName: {{.storageclass}}
    volumeMode: {{.volumemode}}