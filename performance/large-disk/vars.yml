# Large Disk Performance Test Configuration Variables
# This file defines all variables used in the large-disk test
#
# Usage Examples:
#
# Simplest - uses run-test.sh wrapper (recommended):
#   ./run-test.sh
#
# With overrides (NOTE: Variable names are case-sensitive!):
#   diskSize=200Gi ./run-test.sh            # Correct: diskSize (camelCase)
#   diskSize=500Gi ./run-test.sh --log-level=debug
#
# Common mistakes to avoid:
#   disksize=200Gi ./run-test.sh            # WRONG: lowercase won't work
#   DISKSIZE=200Gi ./run-test.sh            # WRONG: uppercase won't work
#
# Advanced - direct kube-burner (requires manual timestamp):
#   runTimestamp=$(date +"run-%Y%m%d-%H%M%S") diskSize=200Gi kube-burner init --config=large-disk-performance.yml --user-data=vars.yml
#

# Test Configuration
testNamespace: "cnv-large-disk"            # Namespace where test resources will be created
testName: 'cnv-large-disk'                 # Test identifier used for labeling and metrics (ES index)
resultsPath: "/tmp/kube-burner-results/large-disk"  # Base directory for test results
runTimestamp: "run-default"               # Auto-generated by run-test.sh

# VM Configuration
vmCount: 1                                 # Number of VMs to create for testing
vmName: "large-disk-vm"                    # VM name prefix

# Large Disk Configuration
largeDiskSize: "100Ti"                     # Large disk size (scenario max: 100Ti)
rootStorage: "50Gi"                        # Root disk storage size

# CPU and Memory Configuration
cpuCores: 16                               # CPU cores allocated to each VM
memory: "32Gi"                             # Memory allocation per VM

# Storage Configuration
storageClassName: "ocs-storagecluster-ceph-rbd"  # Storage class for PVC provisioning

# VM Image Configuration
baseImage: "quay.io/containerdisks/fedora:44"  # Container disk image for root disk
osType: "rhel9"                            # Operating system type

# Guest OS Configuration (Linux or Windows)
guestOS: "linux"                           # Set to "windows" for Windows VM testing
windowsImageUrl: "pvc://openshift-virtualization-os-images/windows-golden"
windowsRootDiskSize: "100Gi"                # Root disk size for Windows VMs (CDI import)

# Performance Test Configuration
enablePerfTest: true                       # Enable disk performance test script in VM

# Test Execution Control
counter: 1                                 # Test iteration counter (0 triggers cleanup)
vmRunning: true                            # Whether VMs should start immediately

# Timeout Configuration
maxWaitTimeout: "120m"                     # Maximum wait time for resource readiness (2 hours for large disks)
jobPause: "15m"                            # Pause between job phases

# Node Targeting Configuration (optional)
nodeSelector: ""                           # Node selector for VM placement (e.g., "node-role.kubernetes.io/worker=")

# SSH Configuration for VM Access
privateKey: '/home/kni/.ssh/id_rsa'       # Path to private key for SSH validation
publicKey: '/home/kni/.ssh/id_rsa.pub'    # Path to SSH public key file
vmUser: 'fedora'                           # Username for SSH access to VMs

# Monitoring Configuration (Optional)
esServer: ""  # Elasticsearch server for metrics storage
metadataIndex: "cnv-metadata"                    # Elasticsearch index for run metadata
PROM: ""                                   # Prometheus endpoint (set via environment to enable monitoring)
PROM_TOKEN: ""                             # Prometheus token (set via environment to enable monitoring)
